# Runs the test suite on every push and pull request, and on demand.
#
# Neither script is exercised against the network here — the tests drive them
# through fake sessions and a captured requests.post, so no secrets and no
# outbound calls are involved.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q

# Save this file as: .github/workflows/connectivity-probe.yml
#
# THROWAWAY DIAGNOSTIC. Delete it once the questions below are answered.
#
# mipe_watch.py run 33747227918 reported success while doing nothing: every
# request to mfe.gov.ro failed with [Errno 101] Network is unreachable. That is
# a routing failure at connect, not an HTTP error, so it is invisible to the
# retry machinery and to a status-code check.
#
# Two questions this answers, which need different fixes:
#   1. Is mfe.gov.ro unreachable because the runner has no IPv6 route to its
#      AAAA record, or because the site blocks cloud IP ranges outright?
#      -> connecting to the A and AAAA addresses separately separates these.
#   2. Do adieuronest.ro and the SEDIA API work from a runner at all? Neither
#      has ever been tested from CI, and if they fail the same way the Monday
#      radar schedule is dead on arrival.
#
# Read-only: it calls the real fetch functions, which return lists and write
# nothing. No state files, no Issues, no secrets.

name: Connectivity probe (throwaway)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Probe
        run: |
          python - <<'PY'
          import errno, json, os, socket, sys, time

          HOSTS = ["mfe.gov.ro", "adieuronest.ro", "api.tech.ec.europa.eu"]
          verdicts = []

          def head(t):
              print(f"\n{'=' * 70}\n{t}\n{'=' * 70}", flush=True)

          # ---------------------------------------------------------------
          # 1. Does this runner have IPv6 at all?
          # ---------------------------------------------------------------
          head("1. Runner IPv6 capability")
          print("socket.has_ipv6 =", socket.has_ipv6)
          try:
              s = socket.socket(socket.AF_INET6, socket.SOCK_STREAM)
              s.settimeout(10)
              s.connect(("2001:4860:4860::8888", 53))  # Google DNS over v6
              s.close()
              v6 = True
              print("-> outbound IPv6 WORKS (connected to 2001:4860:4860::8888:53)")
          except OSError as exc:
              v6 = False
              print(f"-> outbound IPv6 DOES NOT WORK: errno {exc.errno} "
                    f"({errno.errorcode.get(exc.errno, '?')}) {exc}")

          # ---------------------------------------------------------------
          # 2. Per-address TCP connect. This is what separates "no route to
          #    the AAAA" from "the site is dropping us".
          # ---------------------------------------------------------------
          head("2. DNS + per-address TCP connect to :443")
          for host in HOSTS:
              print(f"\n--- {host} ---")
              try:
                  infos = socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
              except OSError as exc:
                  print(f"  getaddrinfo FAILED: {exc}")
                  verdicts.append(f"{host}: DNS failure")
                  continue

              seen, results = set(), []
              for family, _, _, _, sockaddr in infos:
                  addr = sockaddr[0]
                  if addr in seen:
                      continue
                  seen.add(addr)
                  fam = "IPv4" if family == socket.AF_INET else "IPv6"
                  s = socket.socket(family, socket.SOCK_STREAM)
                  s.settimeout(15)
                  t0 = time.time()
                  try:
                      s.connect(sockaddr)
                      ms = (time.time() - t0) * 1000
                      print(f"  {fam:4} {addr:40} CONNECTED in {ms:.0f}ms")
                      results.append((fam, "ok"))
                  except OSError as exc:
                      name = errno.errorcode.get(exc.errno, "?")
                      print(f"  {fam:4} {addr:40} FAILED errno {exc.errno} ({name}): {exc}")
                      results.append((fam, name))
                  finally:
                      s.close()

              ok4 = any(f == "IPv4" and r == "ok" for f, r in results)
              has6 = any(f == "IPv6" for f, _ in results)
              ok6 = any(f == "IPv6" and r == "ok" for f, r in results)
              if ok4:
                  verdicts.append(f"{host}: IPv4 reachable"
                                  + (" (AAAA present but unreachable)" if has6 and not ok6 else ""))
              elif has6 and not ok6:
                  verdicts.append(f"{host}: UNREACHABLE on both families")
              else:
                  verdicts.append(f"{host}: IPv4 UNREACHABLE")

          # ---------------------------------------------------------------
          # 3. The real code paths, with their real sessions and User-Agents.
          #    A host can accept a TCP connection and still WAF the request.
          # ---------------------------------------------------------------
          head("3. Real fetch paths")

          # reason: the watchers are top-level modules with nothing to install,
          # so they are only importable if the repo root is on sys.path. Reading
          # this script from stdin happens to put cwd there, but relying on that
          # cost a run when the same script was executed by path and every
          # import failed with ModuleNotFoundError. Be explicit.
          sys.path.insert(0, os.getcwd())

          print("\n--- mipe_watch: GET the watched calendar page ---")
          try:
              import mipe_watch as mw
              sess = mw.create_resilient_session()
              url = list(mw.WATCHED_PAGES.values())[0]
              r = sess.get(url, timeout=30)
              print(f"  {r.status_code} {len(r.content)} bytes from {url}")
              verdicts.append(f"mipe_watch fetch: HTTP {r.status_code}")
          except Exception as exc:
              print(f"  FAILED: {type(exc).__name__}: {exc}")
              verdicts.append(f"mipe_watch fetch: FAILED ({type(exc).__name__})")

          print("\n--- funding_radar: adieuronest CSV ---")
          try:
              import funding_radar as fr
              sess = fr.create_resilient_session()
              calls = fr.fetch_adieuronest_calls(sess)
              print(f"  {len(calls)} matching calls (local baseline: 35-37)")
              verdicts.append(f"adieuronest fetch: {len(calls)} calls")
          except Exception as exc:
              print(f"  FAILED: {type(exc).__name__}: {exc}")
              verdicts.append(f"adieuronest fetch: FAILED ({type(exc).__name__})")

          print("\n--- funding_radar: EU SEDIA API ---")
          try:
              import funding_radar as fr
              sess = fr.create_resilient_session()
              calls = fr.fetch_eu_sedia_calls(sess)
              print(f"  {len(calls)} unique calls (local baseline: 22)")
              verdicts.append(f"SEDIA fetch: {len(calls)} calls")
          except Exception as exc:
              print(f"  FAILED: {type(exc).__name__}: {exc}")
              verdicts.append(f"SEDIA fetch: FAILED ({type(exc).__name__})")

          head("VERDICT")
          print(f"runner outbound IPv6: {'yes' if v6 else 'NO'}")
          for v in verdicts:
              print(" -", v)
          PY
